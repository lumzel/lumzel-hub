id: lemo-opuscar
name: Lemo-Opuscar
icon: 🎬
category: Design
description: 'A toolbox of film styles made entirely in code: 99 ready-to-use styles or your own, procedural visual rendering, Kokoro TTS narration, sound design, and ffmpeg mixing.'
i18n:
  en:
    name: Lemo-Opuscar
    description: 'A toolbox of film styles made entirely in code: 99 ready-to-use styles or your own, procedural visual rendering, Kokoro TTS narration, sound design, and ffmpeg mixing.'
  zh-CN:
    name: Lemo-Opuscar 代码短片
    description: 一套用代码做片的风格工具箱：99 种现成影片风格与自定义风格，纯代码动画渲染、Kokoro 语音解说、程序化音效与音乐、ffmpeg 混音成片。
author: Lemomo (LemoLab)
homepage: https://github.com/lemomo-ai/lemo-opuscar
skills:
- lemo-opuscar
agents: {}
mcp: []
hooks: []
rules:
- opuscar-custom-styles
- opuscar-directing
- opuscar-technique
plugins: []
env:
  LEMO_OPUSCAR_HOME: ''
  LEMO_FETCH: '1'
  HF_ENDPOINT: ''
env_schema:
  LEMO_OPUSCAR_HOME:
    label: Lemo-Opuscar Home
    description: Directory for cached models, sound fonts, and rendered clips (optional).
    placeholder: ~/.cache/lemo-opuscar
    default: ''
    required: false
    i18n:
      zh-CN:
        label: 资产缓存目录
        description: 可选指定 Kokoro 语音模型与渲染资源缓存目录（留空使用默认目录）。
        placeholder: ~/.cache/lemo-opuscar
  LEMO_FETCH:
    label: Auto-Download Models
    description: Allow downloading missing Kokoro TTS weights on first run ('1' or '0').
    default: '1'
    required: false
    options:
    - value: '1'
      label: Enabled (1)
    - value: '0'
      label: Disabled (0)
    i18n:
      zh-CN:
        label: 自动下载模型权重
        description: 首次运行缺少语音或素材模型时是否允许自动下载（1 允许，0 禁止）。
  HF_ENDPOINT:
    label: Hugging Face Mirror Endpoint
    description: Optional custom Hugging Face hub URL for fetching model assets.
    placeholder: https://hf-mirror.com
    default: ''
    required: false
    i18n:
      zh-CN:
        label: Hugging Face 镜像地址
        description: 可选配置 Hugging Face 模型下载镜像端点。
        placeholder: https://hf-mirror.com
