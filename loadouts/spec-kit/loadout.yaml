id: spec-kit
name: GitHub Spec-Kit (SDD)
icon: 📐
category: Architecture
description: 'Complete GitHub Spec-Kit SDD suite (github/spec-kit): official speckit-* workflow skills (Constitution, Specify, Clarify, Plan, Checklist, Tasks, Analyze, Implement, Converge) bundled with official templates & SDD principles.'
i18n:
  en:
    name: GitHub Spec-Kit (SDD)
    description: 'Complete GitHub Spec-Kit SDD suite (github/spec-kit): official speckit-* workflow skills (Constitution, Specify, Clarify, Plan, Checklist, Tasks, Analyze, Implement, Converge) bundled with official templates & SDD principles.'
  zh-CN:
    name: GitHub Spec-Kit 规格驱动开发
    description: 完整同步 GitHub 官方 Spec-Kit（github/spec-kit）：包含 speckit-* 规格驱动开发全流程 Skill（Constitution / Specify / Clarify / Plan / Checklist / Tasks / Analyze / Implement / Converge）及全套官方模板。
author: GitHub
homepage: https://github.com/github/spec-kit
skills:
- speckit-analyze
- speckit-checklist
- speckit-clarify
- speckit-constitution
- speckit-converge
- speckit-implement
- speckit-plan
- speckit-specify
- speckit-tasks
agents:
  speckit-analyst: {}
  speckit-contract-architect: {}
mcp: []
hooks: []
rules:
- speckit-sdd-principles
plugins: []
env:
  SPECIFY_FEATURE: ''
  SPECIFY_INIT_DIR: ''
  SPECIFY_FEATURE_NO_PERSIST: '0'
env_schema:
  SPECIFY_FEATURE:
    label: Active Specify Feature
    description: Default feature ID override for Spec-Kit commands (optional).
    placeholder: 001-user-auth
    default: ''
    required: false
    i18n:
      zh-CN:
        label: 默认 Feature 标识
        description: 可选指定 Spec-Kit 命令默认聚焦的 Feature ID。
        placeholder: 001-user-auth
  SPECIFY_INIT_DIR:
    label: Spec-Kit Init Directory
    description: Custom directory root for Spec-Kit artifacts (defaults to repo root).
    placeholder: .specify
    default: ''
    required: false
    i18n:
      zh-CN:
        label: Spec-Kit 初始化目录
        description: 自定义 Spec-Kit 产物目录根路径（留空则使用仓库默认目录）。
        placeholder: .specify
  SPECIFY_FEATURE_NO_PERSIST:
    label: Disable Feature State Persistence
    description: Set to '1' to prevent Spec-Kit from persisting active feature state on disk.
    default: '0'
    required: false
    options:
    - value: '0'
      label: Persist State (0)
    - value: '1'
      label: Do Not Persist (1)
    i18n:
      zh-CN:
        label: 禁止持久化当前 Feature 状态
        description: 设为 1 时，不在磁盘上自动记录当前激活的 Feature 状态。
