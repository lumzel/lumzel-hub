<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>发版就绪看板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="board">
      <header class="head">
        <div>
          <h1 id="title">发版就绪看板</h1>
          <p class="sub">核对测试、构建、变更日志与安全门禁状态</p>
        </div>
        <button id="audit-btn" class="primary">让 Agent 执行发版核验</button>
      </header>
      <section class="grid" id="checks">
        <article class="card">
          <b>自动化测试与构建</b>
          <p>确认全部单元与集成测试通过，生产构建无警告。</p>
        </article>
        <article class="card">
          <b>破坏性变更与迁移</b>
          <p>检查数据库 Schema、配置格式与公开 API 兼容性。</p>
        </article>
        <article class="card">
          <b>安全与凭据扫描</b>
          <p>排查硬编码密钥、高危依赖漏洞与权限新增项。</p>
        </article>
      </section>
    </main>
    <script src="/sdk.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
