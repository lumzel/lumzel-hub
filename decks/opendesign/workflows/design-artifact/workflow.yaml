id: design-artifact
description: "Structured OpenDesign pipeline: load DESIGN.md -> propose visual directions -> optional direction gate -> build tagged HTML artifact -> deterministic anti-slop lint & 5-axis critique loop."

inputs:
  artifactId:
    type: string
    required: true
  title:
    type: string
    required: true
  surface:
    type: string
    default: prototype
  brief:
    type: string
    required: true
  systemSlug:
    type: string
    default: editorial-slate
  targetPath:
    type: string
    required: true
  designSystemPath:
    type: string
    default: .lumzel/opendesign/design-systems/editorial-slate/DESIGN.md
  tokensPath:
    type: string
    default: .lumzel/opendesign/design-systems/editorial-slate/tokens.css
  skipDirectionGate:
    type: boolean
    default: false

budget:
  maxMinutes: 45
  maxIterations: 8

state:
  round: 0

nodes:
  - id: load_context
    kind: code
    uses: ./scripts/lint-artifact.js#loadDesignContext

  - id: propose_directions
    kind: agent
    dependsOn: [load_context]
    session: run
    summary: "为「{{inputs.title}}」（{{inputs.surface}}）探索 3 套视觉方向"
    prompt: |
      You are running the Discovery & Direction stage of OpenDesign for "{{inputs.title}}" (surface: {{inputs.surface}}).

      Brief:
      {{inputs.brief}}

      Active DESIGN.md contract:
      {{outputs.load_context.designMd}}

      Before proposing any direction:
      1. Unless the Brief explicitly specifies a separate/greenfield product unrelated to this workspace, use your native tools in the current working directory to explore the project and understand what product it builds, its target platform/form factor, and its real domain workflows.
      2. Ground `assumptions` and all 3 `directions` strictly in that real product and platform — NEVER invent an unrelated generic SaaS dashboard or issue-triage workbench when designing for an existing product.
      3. Write `assumptions`, `name`, `rationale`, and `layoutIdea` in the same language as the Brief (e.g., Chinese if Brief is Chinese, English if Brief is English).

      Do NOT write HTML files yet. Return ONLY valid JSON (no prose or markdown outside JSON) with:
      - `assumptions`: 2-3 concise discovery assumptions as plain strings (the first assumption MUST identify the product, platform/form factor, and core workflows)
      - `directions`: 3 distinct visual directions tailored to the product, brief, and DESIGN.md

      Every field inside each direction (`id`, `name`, `rationale`, `palette`, `typography`, `layoutIdea`) MUST be a single plain string (never a nested object or array):
      - `palette`: concise single-line color summary string, e.g. `"#fbfbfb / #09090b / #0070e3"`
      - `typography`: concise single-line font/scale summary string, e.g. `"Inter + Geist Mono tabular-nums"`

      Reply with JSON only matching this exact shape:
      {"assumptions":["string"],"directions":[{"id":"kebab-case-id","name":"string","rationale":"string","palette":"#bg / #surface / #fg / #accent","typography":"Display + Body + Mono summary","layoutIdea":"string"}]}
    outputSchema:
      type: object
      title: 视觉方向提案
      required: [assumptions, directions]
      properties:
        assumptions:
          type: array
          title: 前提假设
          x-lumzel: { view: list }
          items:
            type: string
        directions:
          type: array
          title: 候选方向
          minItems: 2
          x-lumzel: { view: cards }
          items:
            type: object
            required: [id, name, rationale, palette, typography, layoutIdea]
            properties:
              id: { type: string }
              name: { type: string }
              rationale: { type: string, title: 理由 }
              palette: { type: string, title: 配色, x-lumzel: { view: code } }
              typography: { type: string, title: 字体 }
              layoutIdea: { type: string, title: 布局 }

  - id: route_direction
    kind: gate
    dependsOn: [propose_directions]
    cases:
      - when: "Boolean(inputs.skipDirectionGate)"
        next: build_artifact
    default: direction_gate

  - id: direction_gate
    kind: gate
    pause: true
    prompt: "Choose a visual direction for \"{{inputs.title}}\" or add steering notes before generating the artifact."
    onFail:
      next: $fail

  - id: build_artifact
    kind: agent
    dependsOn: [route_direction, direction_gate]
    join: any
    session: run
    summary: "根据选定视觉方向构建交互式 HTML 产物：{{inputs.targetPath}}"
    prompt: |
      Use the `opendesign-studio` skill rules to generate a single-file, self-contained interactive HTML artifact at:
      {{inputs.targetPath}}

      Title: {{inputs.title}}
      Surface: {{inputs.surface}}
      Design System Slug: {{inputs.systemSlug}}

      User Brief:
      {{inputs.brief}}

      Discovery Assumptions:
      {{JSON.stringify(outputs.propose_directions.assumptions || [])}}

      Selected Direction / Steering:
      {{JSON.stringify((outputs.direction_gate && outputs.direction_gate.payload && (outputs.direction_gate.payload.direction || outputs.direction_gate.payload.directionId || outputs.direction_gate.payload.steering)) ? outputs.direction_gate.payload : (outputs.propose_directions.directions[0] || {}))}}

      Proposed Directions Reference:
      {{JSON.stringify(outputs.propose_directions.directions)}}

      Active DESIGN.md:
      {{outputs.load_context.designMd}}

      Active tokens.css (inline into <style id="od-tokens"> with fallback values):
      {{outputs.load_context.tokensCss}}

      Requirements:
      1. Product Grounding: Inspect relevant files in the current working directory if needed so every screen, label, metric, control, and flow faithfully represents the real product and its platform form factor (e.g., macOS menu-bar popover / settings window / fullscreen overlay vs web app vs mobile screen). Never fabricate unrelated SaaS modules.
      2. Write the complete HTML file directly to `{{inputs.targetPath}}` (create parent directories if needed).
      3. Tag all major structural & interactive elements with unique kebab-case `data-od-id="..."` attributes.
      4. Include `<meta name="viewport" content="width=device-width, initial-scale=1">` and zero external CDN links.
      5. Make interactions genuinely work in vanilla JS (tabs, filters, drawers, forms, state transitions, or slide navigation for `slides` surface).
      6. Match all visible UI copy to the language of the User Brief / Title, and avoid Lorem ipsum, Acme Corp, unprompted purple gradients, or generic boilerplate.

  - id: lint_artifact
    kind: code
    dependsOn: [build_artifact]
    uses: ./scripts/lint-artifact.js#lintArtifact

  - id: critique_artifact
    kind: agent
    dependsOn: [lint_artifact]
    session: new
    summary: "对 {{inputs.targetPath}} 执行 5 轴设计与反套路评审"
    prompt: |
      Use the `opendesign-critique` skill (Mode A: 5-Axis Design Critique) to inspect `{{inputs.targetPath}}` against `{{inputs.designSystemPath}}`, the brief, and the actual product in this workspace.

      Title: "{{inputs.title}}" (surface: {{inputs.surface}})
      Brief: "{{inputs.brief}}"

      Discovery Assumptions:
      {{JSON.stringify(outputs.propose_directions.assumptions || [])}}

      Deterministic lint result:
      {{JSON.stringify(outputs.lint_artifact)}}

      Instructions:
      1. Unless the Brief explicitly defines an external/greenfield product unrelated to this workspace, inspect the current working directory autonomously to verify that the prototype's domain entities, workflows, copy, and form factor authentically match the real product.
      2. Read `{{inputs.targetPath}}` and score 0-100 across Philosophy, Hierarchy, Execution, Specificity, and Restraint. If the artifact depicts an unrelated generic domain/product instead of the actual product, score `Specificity <= 35` and `score < 60` (`passed: false`) with concrete findings explaining what real product screens/flows are missing.
      3. Return ONLY valid JSON (no prose or markdown outside JSON; `findings` MUST be an array of plain strings, NOT objects):
      {"score":85,"passed":true,"summary":"1-2 sentence overall critique summary","axes":{"Philosophy":85,"Hierarchy":86,"Execution":84,"Specificity":85,"Restraint":85},"findings":["[data-od-id=\"...\"] Concrete issue and fix"]}
    outputSchema:
      type: object
      title: 设计评审
      required: [score, passed, summary, findings]
      properties:
        score: { type: number, title: 总分, x-lumzel: { view: score, max: 100 } }
        passed: { type: boolean, title: 是否通过, x-lumzel: { view: verdict } }
        summary: { type: string, title: 结论, x-lumzel: { view: lead } }
        axes:
          type: object
          title: 五轴得分
          x-lumzel: { view: meters, max: 100 }
        findings:
          type: array
          title: 问题与修改建议
          x-lumzel: { view: list }
          items:
            type: string

  - id: quality_gate
    kind: gate
    dependsOn: [critique_artifact]
    maxIterations: 2
    onExceed: finalize
    cases:
      - when: "!outputs.lint_artifact.ok || (outputs.critique_artifact && outputs.critique_artifact.score < 78)"
        next: revise_from_critique
        advanceRound: true

  - id: revise_from_critique
    kind: agent
    session: run
    next: lint_artifact
    summary: "根据第 {{state.round}} 轮评审与静态检查结果修订 {{inputs.targetPath}}"
    prompt: |
      Revise `{{inputs.targetPath}}` to resolve all deterministic lint issues and design critique findings while keeping the design faithfully grounded in the target product.

      Title: {{inputs.title}}
      Brief: {{inputs.brief}}

      Lint issues:
      {{outputs.lint_artifact.summary}}

      Critique score ({{outputs.critique_artifact.score}}/100) findings:
      {{JSON.stringify(outputs.critique_artifact.findings)}}

      Preserve existing `data-od-id` attributes when keeping elements (or replace off-topic placeholder sections cleanly if critique flagged a product-fit mismatch), keep all styles/scripts self-contained, and overwrite `{{inputs.targetPath}}` cleanly.

  - id: finalize
    kind: code
    dependsOn: [quality_gate]
    uses: ./scripts/lint-artifact.js#finalizeArtifact
