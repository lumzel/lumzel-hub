id: feature-ship
description: 约束注入 → 拆分 → 每单元先红后绿（隔离 Worktree，≤3 次纠错）→ 确定性集成 → 唯一人工闸门 → 合入 → 沉淀约束
trigger:
  autoRun: false
  inputHint: 描述要交付的 Feature（一句话即可；越具体，拆分越准）
inputs:
  requirement:
    type: string
    required: true
    description: 一句话需求
  constraints:
    type: array
    default: []
    description: Deck 传入的已启用约束文本
  lessonsFile:
    type: string
    default: .lumzel/hanakoxbt-loops-and-graphs/lessons.md
  fullCheckCmd:
    type: string
    default: ""
    description: 全量检查命令；空 = 自动探测
  setupCmd:
    type: string
    default: auto
    description: 每个新 Worktree 的依赖安装命令；auto = 自动探测；空串 = 不执行
  units:
    type: array
    default: []
    description: 预设单元（跳过 split，用于单单元重跑）
  maxUnits:
    type: number
    default: 5
  commitFlags:
    type: string
    default: ""
    description: 例如 --no-verify
  checkPrefixes:
    type: array
    default: ["pnpm ", "npm ", "npx ", "yarn ", "bun ", "vitest", "jest", "cargo test", "pytest", "python -m pytest", "uv run pytest", "go test", "deno test", "swift test", "make test"]
budget:
  maxMinutes: 240
  maxIterations: 16
state:
  slug: ""
  candidate: null
  branches: []
  reworks: 0
nodes:
  - id: preflight
    kind: code
    uses: ./scripts/preflight.js#preflight

  - id: preflight_gate
    kind: gate
    dependsOn: [preflight]
    cases:
      - when: "!outputs.preflight.clean"
        next: $fail
      - when: "outputs.preflight.presetUnits.length > 0"
        next: plan
    default: split

  - id: split
    kind: agent
    session: new
    effort: high
    permissions: ask
    timeoutSec: 900
    promptFile: ./prompts/split.md
    outputSchema: ./schemas/units.schema.json

  - id: plan
    kind: code
    dependsOn: [split]
    join: any
    uses: ./scripts/plan.js#plan

  - id: units
    kind: map
    dependsOn: [plan]
    forEach: "outputs.plan.units"
    concurrency: 3
    worktree: isolated
    nodes:
      - id: lane_start
        kind: code
        uses: ./scripts/unit.js#laneStart
      - id: setup
        kind: shell
        dependsOn: [lane_start]
        command: "{{outputs.preflight.setupCmd || 'true'}}"
        timeoutSec: 900
      - id: write_check
        kind: agent
        dependsOn: [setup]
        session: new
        permissions: auto
        timeoutSec: 900
        promptFile: ./prompts/write-check.md
      - id: verify_red
        kind: shell
        dependsOn: [write_check]
        command: "{{item.checkCmd}}"
        timeoutSec: 600
        continueOnError: true
      - id: red_gate
        kind: gate
        dependsOn: [verify_red]
        maxIterations: 2
        check:
          kind: code
          uses: ./scripts/unit.js#redCheck
        onFail:
          next: write_check
        onExceed: $fail
      - id: commit_red
        kind: shell
        dependsOn: [red_gate]
        command: 'git add -A && git commit {{inputs.commitFlags}} -m "test({{item.id}}): failing acceptance check"'
        timeoutSec: 120
      - id: impl
        kind: agent
        dependsOn: [commit_red]
        session: new
        permissions: auto
        timeoutSec: 1800
        promptFile: ./prompts/impl.md
      - id: verify_green
        kind: shell
        dependsOn: [impl]
        command: "{{item.checkCmd}}"
        timeoutSec: 600
        continueOnError: true
      - id: green_gate
        kind: gate
        dependsOn: [verify_green]
        maxIterations: 3
        check:
          kind: code
          uses: ./scripts/unit.js#greenCheck
        onFail:
          next: impl
        onExceed: $fail
      - id: commit
        kind: shell
        dependsOn: [green_gate]
        command: 'git add -A && git commit {{inputs.commitFlags}} -m "{{item.commitMessage}}"'
        timeoutSec: 120
      - id: unit_report
        kind: code
        dependsOn: [commit]
        uses: ./scripts/unit.js#unitReport

  - id: integrate
    kind: code
    dependsOn: [units]
    worktree: isolated
    uses: ./scripts/integrate.js#integrate

  - id: integrate_gate
    kind: gate
    dependsOn: [integrate]
    cases:
      - when: "!outputs.integrate.shippable"
        next: retro

  - id: human_gate
    kind: gate
    dependsOn: [integrate_gate]
    pause: true
    prompt: |
      Ship {{state.candidate.passed}}/{{state.candidate.total}} unit(s) from {{state.candidate.branch}} into {{outputs.preflight.branch}}?
      Full check: {{state.candidate.checkOk ? 'PASS' : 'FAIL'}} · {{state.candidate.filesChanged}} files (+{{state.candidate.insertions}} −{{state.candidate.deletions}}) · risk {{state.candidate.risk.level}}
    onFail:
      next: rework

  - id: rework
    kind: agent
    session: new
    worktree: isolated
    permissions: auto
    timeoutSec: 1800
    promptFile: ./prompts/rework.md

  - id: reverify
    kind: code
    dependsOn: [rework]
    worktree: isolated
    uses: ./scripts/integrate.js#reverify
    next: human_gate
    maxIterations: 3
    onExceed: $fail

  - id: ship
    kind: shell
    dependsOn: [human_gate]
    timeoutSec: 300
    command: 'git merge --no-ff --no-edit -m "{{state.candidate.mergeMessage}}" {{state.candidate.branch}}'

  - id: retro
    kind: code
    dependsOn: [ship]
    join: any
    uses: ./scripts/learn.js#retro

  - id: distill
    kind: agent
    dependsOn: [retro]
    session: new
    permissions: ask
    timeoutSec: 600
    promptFile: ./prompts/distill.md

  - id: record
    kind: code
    dependsOn: [distill]
    uses: ./scripts/learn.js#record

  - id: finish
    kind: gate
    dependsOn: [record]
    cases:
      - when: "outputs.ship && outputs.ship.ok"
        next: $done
    default: $fail
