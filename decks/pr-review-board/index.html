<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>代码审查面板</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="board">
      <header class="head">
        <div>
          <h1 data-i18n="title">代码审查面板</h1>
          <p class="sub" data-i18n="sub">按编码规范（Standards）与功能规格（Spec）双轴审查当前分支变更</p>
        </div>
        <button type="button" id="review-btn" class="primary" data-action="review" data-i18n="reviewBtn">
          启动双轴审查
        </button>
      </header>
      <p class="banner" id="banner" hidden></p>
      <section class="grid">
        <article class="card">
          <div class="card-top">
            <b data-i18n="reviewTitle">双轴全量审查</b>
            <code class="skill-tag">pr-review-board-review</code>
          </div>
          <p data-i18n="reviewDesc">同时对照项目编码规范与需求规格审查当前分支与工作区改动，分级输出问题。</p>
          <button type="button" class="ghost" data-action="review" data-i18n="reviewRun">运行双轴审查</button>
        </article>
        <article class="card">
          <div class="card-top">
            <b data-i18n="standardsTitle">Standards（工程规范）</b>
            <code class="skill-tag">pr-review-board-standards</code>
          </div>
          <p data-i18n="standardsDesc">检查命名清晰度、重复逻辑、边界异常处理与项目约定遵循情况。</p>
          <button type="button" class="ghost" data-action="standards" data-i18n="standardsRun">仅查工程规范</button>
        </article>
        <article class="card">
          <div class="card-top">
            <b data-i18n="specTitle">Spec（需求契合度）</b>
            <code class="skill-tag">pr-review-board-spec</code>
          </div>
          <p data-i18n="specDesc">核对功能实现完整性、边界条件覆盖率与非预期范围蔓延（Scope Creep）。</p>
          <button type="button" class="ghost" data-action="spec" data-i18n="specRun">仅查需求规格</button>
        </article>
      </section>
    </main>
    <script src="/sdk.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
