<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>方案工作台</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="app" id="app" data-state="loading">
      <nav class="rail" aria-label="Feature">
        <button type="button" class="feat hub" id="hub">
          <b data-i18n="hub">文档中心</b>
          <small id="hub-count">docs/</small>
        </button>
        <div class="rail-head">
          <span>Feature</span>
          <button type="button" class="ico" id="refresh" data-i18n-title="refresh" title="刷新">↻</button>
        </div>
        <div class="feats" id="feats"></div>
        <button type="button" class="new-feat" id="new-feat" data-i18n="newFeaturePlus">＋ 新建 Feature</button>
      </nav>

      <main class="main">
        <p class="note" id="note" hidden></p>

        <section class="pane" id="pane-feature" hidden>
          <header class="fhead">
            <div class="fh1">
              <b id="f-title"></b>
              <span class="mono" id="f-id"></span>
              <span class="pill" id="f-status"></span>
              <span class="sp"></span>
              <button type="button" class="act" data-act="prototype" data-i18n="prototypeAct">做原型</button>
              <button type="button" class="act" data-act="tickets" data-i18n="ticketsAct">切工单</button>
              <button type="button" class="act" data-act="implement" data-i18n="implementAct">实现下一张</button>
              <button type="button" class="act" data-act="review" data-i18n="reviewAct">评审改动</button>
            </div>
            <p class="fsum" id="f-summary"></p>
            <div class="tabs" role="tablist">
              <button type="button" class="tab" role="tab" data-tab="design" data-i18n="design">设计</button>
              <button type="button" class="tab" role="tab" data-tab="tickets">
                <span data-i18n="tickets">工单</span><span class="count" id="t-count"></span>
              </button>
              <button type="button" class="tab" role="tab" data-tab="prototype" data-i18n="prototype">原型</button>
            </div>
          </header>

          <div class="body" id="tab-design" data-tab-body="design"></div>

          <div class="body" id="tab-tickets" data-tab-body="tickets">
            <div class="tickets" id="tickets">
              <div class="filters" id="filters"></div>
              <div class="rows" id="rows"></div>
            </div>
            <div class="ticket-open" id="ticket-open" hidden>
              <button type="button" class="back" id="ticket-back"></button>
            </div>
          </div>

          <div class="body" id="tab-prototype" data-tab-body="prototype">
            <div class="screens" id="screens" role="tablist" data-i18n-aria="prototypeScreens" aria-label="原型屏"></div>
            <p class="intro" id="intro" hidden></p>
            <div class="proto-frame" id="proto-frame"></div>
          </div>
        </section>

        <section class="pane" id="pane-hub" hidden>
          <header class="fhead">
            <div class="fh1"><b data-i18n="hub">文档中心</b><span class="mono" id="hub-sub"></span></div>
          </header>
          <div class="body scroll" id="hub-body"></div>
          <div class="body" id="hub-doc" hidden>
            <button type="button" class="back" id="hub-back"></button>
          </div>
        </section>

        <section class="pane empty-pane" id="pane-empty" hidden>
          <div class="empty-card">
            <div class="dia">◆</div>
            <h2 data-i18n="emptyTitle">还没有 Feature</h2>
            <p data-i18n="emptyHint">一个 Feature 是一份设计文档（docs/features/&lt;id&gt;/design.html），之后切成工单、画成原型。</p>
            <button type="button" class="primary" id="empty-new" data-i18n="newFeature">新建 Feature</button>
          </div>
        </section>
      </main>

      <div class="scrim" id="new-dialog" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-h">
          <h3 id="new-h" data-i18n="newFeature">新建 Feature</h3>
          <label
            ><span>Feature id</span>
            <input id="new-id" placeholder="invoice-cache" autocomplete="off" spellcheck="false" />
            <small data-i18n="idHelp">小写字母、数字和 -，也是文件夹名 docs/features/&lt;id&gt;/</small>
          </label>
          <label
            ><span data-i18n="nameLabel">名称</span>
            <input id="new-title" autocomplete="off" />
          </label>
          <label
            ><span data-i18n="briefLabel">要做什么</span>
            <textarea id="new-brief" rows="3" data-i18n-placeholder="briefPlaceholder" placeholder="一两句话说明要解决的问题"></textarea>
          </label>
          <p class="err" id="new-err"></p>
          <div class="modal-row">
            <button type="button" id="new-cancel" data-i18n="cancel">取消</button>
            <button type="button" class="primary" id="new-ok" data-i18n="startDesign">开会话设计</button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <script src="/sdk.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
