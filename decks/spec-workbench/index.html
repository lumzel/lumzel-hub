<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>方案工作台</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <div class="app" id="app" data-state="loading">
      <nav class="rail" id="rail" aria-label="Features">
        <div class="rail-head">
          <span class="rail-title-wrap">
            <span data-i18n="featuresHeader">需求列表</span>
            <span class="sort-badge" data-i18n="sortDescHint">时间倒序</span>
          </span>
          <button type="button" class="ico" id="refresh" data-i18n-title="refresh" title="刷新">↻</button>
        </div>
        <div class="feats" id="feats"></div>
        <div class="archived-rail" id="archived-rail" hidden></div>
      </nav>

      <main class="main">
        <div class="topbar" id="topbar">
          <button type="button" class="ico rail-toggle" id="rail-toggle" aria-expanded="true" data-i18n-title="collapseRail" data-i18n-aria="collapseRail" title="收起需求列表" aria-label="收起需求列表">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <rect x="1.8" y="2.5" width="12.4" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.35"/>
              <path d="M5.8 2.5v11" stroke="currentColor" stroke-width="1.35"/>
            </svg>
          </button>
          <button type="button" class="act primary-soft topbar-new" id="new-feat" data-i18n="newFeaturePlus">＋ 新建需求</button>
          <div class="live-runs" id="live-runs"></div>
          <span class="sp"></span>
          <div class="agent-wrap" id="agent-wrap" hidden>
            <button type="button" class="agent-btn" id="agent-btn" aria-expanded="false" aria-haspopup="dialog">
              <span class="agent-dot" id="agent-dot" aria-hidden="true"></span>
              <span class="agent-label" id="agent-label">Agent</span>
              <span class="agent-caret" aria-hidden="true">▾</span>
            </button>
            <div class="agent-pop" id="agent-pop" role="dialog" hidden>
              <div class="agent-pop-head">
                <strong data-i18n="agentTitle">会话 Agent 与模型</strong>
                <div class="agent-pop-actions">
                  <span class="agent-pill" id="agent-badge">默认</span>
                  <button type="button" class="agent-link" id="agent-reset-btn" data-i18n="agentReset" hidden>恢复默认</button>
                </div>
              </div>
              <label class="agent-field">
                <span data-i18n="agentFieldAgent">Agent</span>
                <select id="agent-select"></select>
              </label>
              <label class="agent-field">
                <span data-i18n="agentFieldModel">模型</span>
                <select id="agent-model-select"></select>
              </label>
              <label class="agent-field" id="agent-effort-row">
                <span data-i18n="agentFieldEffort">思考强度</span>
                <select id="agent-effort-select"></select>
              </label>
              <div class="agent-pop-foot">
                <p class="agent-hint" id="agent-hint"></p>
                <button type="button" class="agent-save" id="agent-save-default-btn" data-i18n="agentSaveDefault" hidden>设为当前项目默认</button>
              </div>
            </div>
          </div>
          <button type="button" class="ico settings-btn" id="settings-btn" data-i18n-title="deckSettings" data-i18n-aria="deckSettings" title="Deck 设置" aria-label="Deck 设置">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.35"/>
              <path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <p class="note" id="note" hidden></p>

        <section class="pane" id="pane-feature" hidden>
          <header class="fhead">
            <div class="fh1">
              <div class="f-meta">
                <b id="f-title"></b>
                <span class="mono" id="f-id"></span>
                <span class="pill" id="f-status"></span>
                <span class="pill archived-pill" id="f-archived" data-i18n="archivedPill" hidden>已归档</span>
                <span class="ftime mono" id="f-time"></span>
              </div>
              <div class="f-actions">
                <button type="button" class="act" id="act-done"></button>
                <button type="button" class="act" data-act="prototype"></button>
                <button type="button" class="act" data-act="tickets"></button>
                <button type="button" class="act primary-soft" data-act="implement"></button>
                <button type="button" class="act" data-act="review"></button>
                <button type="button" class="ico more-btn" id="f-more" data-i18n-title="moreActions" data-i18n-aria="moreActions" title="更多操作" aria-label="更多操作">⋯</button>
              </div>
            </div>
            <p class="fsum" id="f-summary"></p>
            <div class="session-strip" id="session-strip" hidden></div>
            <div class="tabs" role="tablist">
              <button type="button" class="tab" role="tab" data-tab="design" data-i18n="design">设计</button>
              <button type="button" class="tab" role="tab" data-tab="tickets">
                <span data-i18n="tickets">工单</span><span class="count" id="t-count"></span>
              </button>
              <button type="button" class="tab" role="tab" data-tab="prototype">
                <span data-i18n="prototype">原型</span><span class="tab-tag" id="p-tag"></span>
              </button>
            </div>
          </header>

          <div class="body" id="tab-design" data-tab-body="design">
            <div class="qa-bar" id="design-qa"></div>
            <div class="frame-wrap" id="design-frame"></div>
          </div>

          <div class="body" id="tab-tickets" data-tab-body="tickets">
            <div class="tickets" id="tickets">
              <div class="tickets-bar" id="tickets-bar">
                <div class="filters" id="filters"></div>
                <div class="tickets-acts">
                  <button type="button" class="act" id="tickets-next-btn"></button>
                  <button type="button" class="act primary-soft" id="tickets-all-btn"></button>
                  <button type="button" class="act" id="tickets-qa-toggle"></button>
                </div>
              </div>
              <div class="qa-bar qa-inline" id="tickets-qa" hidden></div>
              <div class="rows" id="rows"></div>
            </div>
            <div class="ticket-open" id="ticket-open" hidden>
              <div class="ticket-head">
                <button type="button" class="back" id="ticket-back"></button>
                <div class="ticket-head-acts" id="ticket-head-acts"></div>
              </div>
              <div class="frame-wrap" id="ticket-frame"></div>
            </div>
          </div>

          <div class="body" id="tab-prototype" data-tab-body="prototype">
            <div class="proto-empty" id="proto-empty" hidden>
              <div class="empty-card">
                <div class="dia">◇</div>
                <h2 data-i18n="protoEmptyTitle">尚未生成原型（可选）</h2>
                <p data-i18n="protoEmptyHint">原型不是前置条件，你可以直接开始实现；也可以一键让 Agent 生成可点击的 HTML 原型。</p>
                <button type="button" class="primary" id="proto-gen-btn" data-i18n="protoGenNow">一键生成原型</button>
              </div>
            </div>
            <div class="proto-ready" id="proto-ready" hidden>
              <div class="proto-bar">
                <div class="screens" id="screens" role="tablist" data-i18n-aria="prototypeScreens" aria-label="原型屏"></div>
                <div class="proto-acts">
                  <button type="button" class="act" id="proto-link-btn" aria-pressed="false" data-i18n="protoLinkingBtn" data-i18n-title="protoLinkingHint">设计联动</button>
                  <button type="button" class="act" id="proto-regen-btn"></button>
                  <button type="button" class="act" id="proto-review-btn"></button>
                </div>
              </div>
              <p class="intro" id="intro" hidden></p>
              <div class="proto-frame" id="proto-frame"></div>
            </div>
          </div>
        </section>

        <section class="pane empty-pane" id="pane-pending" hidden>
          <div class="empty-card pending-card">
            <div class="pending-spinner" id="pending-spinner"></div>
            <h2 id="pending-title" data-i18n="pendingTitle">正在会话中创建需求设计</h2>
            <p class="mono" id="pending-id"></p>
            <p id="pending-brief"></p>
            <p class="pending-hint" id="pending-hint"></p>
            <div class="pending-acts">
              <button type="button" class="primary" id="pending-open-session" data-i18n="viewSession">查看会话</button>
              <button type="button" class="act" id="pending-refresh" data-i18n="refresh">刷新</button>
              <button type="button" class="act" id="pending-remove" data-i18n="removePending" hidden>移除占位</button>
            </div>
          </div>
        </section>

        <section class="pane empty-pane" id="pane-empty" hidden>
          <div class="empty-card">
            <div class="dia">◆</div>
            <h2 data-i18n="emptyTitle">还没有需求</h2>
            <p data-i18n="emptyHint">创建一个需求后，Agent 会在可见会话中生成设计文档（docs/features/&lt;id&gt;/design.html），工单与原型均为可选。</p>
            <button type="button" class="primary" id="empty-new" data-i18n="newFeature">新建需求</button>
          </div>
        </section>
      </main>

      <div class="scrim" id="new-dialog" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-h">
          <h3 id="new-h" data-i18n="newFeature">新建需求</h3>
          <label
            ><span data-i18n="briefLabel">需求说明</span>
            <textarea id="new-brief" rows="5" data-i18n-placeholder="briefPlaceholder" placeholder="描述要解决的问题、目标或关键约束（如：给发票详情页加 Redis 缓存，目标 p95 < 20ms）"></textarea>
            <small data-i18n="newAutoHint">需求 ID 与需求名称将根据说明自动生成，并直接发送给 Agent 开始设计。</small>
          </label>
          <p class="err" id="new-err"></p>
          <div class="modal-row">
            <button type="button" id="new-cancel" data-i18n="cancel">取消</button>
            <button type="button" class="primary" id="new-ok" data-i18n="startDesign">创建会话并设计</button>
          </div>
        </div>
      </div>

      <div class="scrim" id="confirm-dialog" hidden>
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-h">
          <h3 id="confirm-h" data-i18n="confirmDeleteTitle">确认删除</h3>
          <p class="confirm-body" id="confirm-body"></p>
          <div class="modal-row">
            <button type="button" id="confirm-cancel" data-i18n="cancel">取消</button>
            <button type="button" class="danger" id="confirm-ok" data-i18n="confirmDeleteBtn">确认删除</button>
          </div>
        </div>
      </div>

      <div class="ctx-menu" id="ctx-menu" role="menu" hidden></div>

      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <script src="/sdk.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
